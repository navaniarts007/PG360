<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PG360 — Offline</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #faf6f0;
        color: #3a2e1f;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 12px;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #c2613b;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 700;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 20px;
      }
      p {
        color: #8b8071;
        max-width: 24rem;
        line-height: 1.5;
        margin: 0;
      }
      button {
        margin-top: 8px;
        border: 0;
        background: #c2613b;
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 22px;
        border-radius: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="badge">PG</div>
      <h1>Can't reach PG360</h1>
      <p>The app needs an internet connection to reach pg360.software. Check your network and try again.</p>
      <button onclick="location.href='https://pg360.software'">Retry</button>
    </div>
  </body>
</html>
