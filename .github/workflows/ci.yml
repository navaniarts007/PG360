name: CI

# The release gate. The Release Console reads this workflow's conclusion for
# main's head commit and refuses to promote anything that isn't green.
#
# Split by severity, matching the lint policy in next.config.ts:
#   lint      — reported, never fatal (style issues must not block a release)
#   typecheck — fatal (a real type error is a real defect)
#   build     — fatal (if it can't build, it can't deploy)

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches the Vercel project's nodeVersion (24.x)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Real values via repo secrets when set; otherwise placeholders. The
          # build never contacts these services — dynamic pages aren't
          # prerendered — but NEXT_PUBLIC_* are inlined, so they must parse.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || 'placeholder' }}
          NEXT_PUBLIC_APP_URL: https://pg360.software
